databases:
  - name: documentocerto-db
    databaseName: documentocerto
    user: documentocerto
    plan: free
    region: oregon

services:
  - type: web
    name: documentocerto
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && node tests/run_all.js
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_NAME
        value: DocumentoCerto
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: documentocerto-db
          property: connectionString
      - key: KIWIFY_WEBHOOK_TOKEN
        sync: false
